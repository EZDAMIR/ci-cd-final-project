apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: oc-final
spec:
  params:
    - name: repo-url
      type: string
      default: https://github.com/EZDAMIR/juphc-tc_pipeline.git
    - name: revision
      type: string
      default: ci-cd-final-project
  workspaces:
    - name: shared-workspace
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: git-clone
      runAfter: [cleanup]
      taskRef:
        name: final-git-clone
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: flake8
      runAfter: [git-clone]
      taskRef:
        name: final-flake8
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: nose
      runAfter: [flake8]
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: buildah
      runAfter: [nose]
      taskRef:
        name: final-build
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: deploy
      runAfter: [buildah]
      taskRef:
        name: final-deploy
      params:
        - name: image
          value: $(tasks.buildah.results.image)
