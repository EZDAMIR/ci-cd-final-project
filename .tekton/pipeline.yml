apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: oc-final
spec:
  params:
    - name: repo-url
      type: string
      default: https://github.com/EZDAMIR/juphc-tc_pipeline.git
    - name: revision
      type: string
      default: ci-cd-final-project
  workspaces:
    - name: shared-workspace
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: clone
      runAfter: [cleanup]
      taskRef:
        name: final-git-clone
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: lint
      runAfter: [clone]
      taskRef:
        name: final-flake8
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: tests
      runAfter: [lint]
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: build
      runAfter: [tests]
      taskRef:
        name: final-build
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: deploy
      runAfter: [build]
      taskRef:
        name: final-deploy
      params:
        - name: image
          value: $(tasks.build.results.image)
