name: CI - lint and unit tests
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-22.04
    container: python:3.9-bookworm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint with flake8
        run: flake8 service tests --count --max-complexity=10 --max-line-length=127 --statistics
      - name: Run unit tests with nose
        run: nosetests -v --with-spec --spec-color --with-coverage --cover-package=service --cover-erase --cover-min-percentage=80 --with-xunit --xunit-file=unittests.xml
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Summarize unit-test results
        run: |
          npm ci --ignore-scripts
          npm run ci:summary
